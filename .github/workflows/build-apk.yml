name: Build QuickCut AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract QuickCut AI project
        run: |
          set -e

          test -f quickcut_ai_final.zip

          rm -rf quickcut_ai
          unzip -o quickcut_ai_final.zip

          echo "Extracted files:"
          find . -maxdepth 3 -type f | sort | head -200

          if [ ! -f "quickcut_ai/pubspec.yaml" ]; then
            echo "ERROR: quickcut_ai/pubspec.yaml not found"
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.0"
          cache: true

      - name: Prepare Flutter project
        working-directory: quickcut_ai
        run: |
          set -e

          flutter create --platforms=android .

          mkdir -p lib

          if [ ! -f "../lib/main.dart" ]; then
            echo "ERROR: Repository lib/main.dart not found"
            exit 1
          fi

          cp ../lib/main.dart lib/main.dart

          echo "main.dart copied successfully."

      - name: Install required packages
        working-directory: quickcut_ai
        run: |
          set -e

          flutter pub add file_picker
          flutter pub add http

          flutter pub get

      - name: Check Dart code
        working-directory: quickcut_ai
        run: |
          set -e

          dart format lib/main.dart --output=none
          flutter analyze

      - name: Build release APK
        working-directory: quickcut_ai
        env:
          AI_BACKEND: ${{ vars.AI_BACKEND }}
        run: |
          set -e

          if [ -z "$AI_BACKEND" ]; then
            AI_BACKEND="https://YOUR-AI-SERVER.com"
          fi

          flutter build apk \
            --release \
            --dart-define=AI_BACKEND="$AI_BACKEND"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickCut-AI-APK
          path: quickcut_ai/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
